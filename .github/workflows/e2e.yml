name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Evita que dos corridas se ejecuten a la vez contra la misma base de datos
# de Neon: si llega un push mientras otra corrida está en marcha, se encola
# en vez de correr en paralelo y arriesgarse a que un globalTeardown borre
# datos que la otra corrida todavía está usando a mitad de un test.
concurrency:
  group: e2e-tests
  cancel-in-progress: false

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar el cliente de Prisma
        run: npx prisma generate

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium

      - name: Correr los tests E2E
        run: npx playwright test

      - name: Subir el reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
